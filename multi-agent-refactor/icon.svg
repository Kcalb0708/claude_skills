<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 三个Agent节点 -->
  <circle cx="32" cy="12" r="8" fill="#6366f1" opacity="0.9"/>
  <circle cx="12" cy="48" r="8" fill="#8b5cf6" opacity="0.9"/>
  <circle cx="52" cy="48" r="8" fill="#a78bfa" opacity="0.9"/>
  <!-- 连接线 -->
  <line x1="26" y1="18" x2="16" y2="42" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
  <line x1="38" y1="18" x2="48" y2="42" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
  <line x1="20" y1="48" x2="44" y2="48" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
  <!-- 中心合并点 -->
  <circle cx="32" cy="36" r="5" fill="#4f46e5"/>
  <!-- 向中心的箭头线 -->
  <line x1="32" y1="20" x2="32" y2="31" stroke="#4f46e5" stroke-width="2.5"/>
  <line x1="17" y1="43" x2="27" y2="38" stroke="#4f46e5" stroke-width="2.5"/>
  <line x1="47" y1="43" x2="37" y2="38" stroke="#4f46e5" stroke-width="2.5"/>
  <!-- Agent图标（人形） -->
  <circle cx="32" cy="10" r="3" fill="white"/>
  <line x1="32" y1="13" x2="32" y2="17" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="12" cy="46" r="3" fill="white"/>
  <line x1="12" y1="49" x2="12" y2="53" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="52" cy="46" r="3" fill="white"/>
  <line x1="52" y1="49" x2="52" y2="53" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 中心合并图标 -->
  <path d="M30 34 L32 38 L34 34" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>